; 拉比克配置示例。部署时:cp config.example.ini config.ini 后按需修改。
; 所有配置都在 [rubick] 段;键名大小写敏感,与后端 Settings 字段一一对应。

[rubick]
; ===== 业务库(线上 MySQL,平台元数据存这里)=====
; 格式:mysql+pymysql://用户名:密码@主机:端口/库名
; 平台自身的表会带 rubick_ 前缀,可安全地与其它系统共用一个库。
DATABASE_URL = mysql+pymysql://rubick:CHANGE_ME@127.0.0.1:3306/rubick
; 护栏:允许连**远端**平台库。默认 false —— DATABASE_URL 指向本机以外的库时,
; API / worker / migrate **一律拒绝启动**。挡的是开发机连线上库这件事:那样的 worker
; 会替线上认领并执行真实取数(认领是原子的,抢到就是抢到),结果文件落在开发机上,
; 线上只剩一条「有记录、无结果」的运行;本机脚本与测试也会直接读写线上库。
; 本机开发与测试请用 sqlite(DATABASE_URL = sqlite:///./rubick.db);
; **只有真正的线上部署才打开这一项**。
ALLOW_REMOTE_DB = false

; ===== 安全 =====
; 生产务必改成随机长字符串(如 openssl rand -hex 32)
JWT_SECRET = change-me-in-prod
JWT_EXPIRE_MINUTES = 720
; 库内敏感字段(数据源密码、用户飞书 token)加密密钥。留空则由 JWT_SECRET 派生;
; 生产建议单独配置(openssl rand -hex 32),与 JWT_SECRET 区分。
; 注意:改动此值会导致已加密数据无法解密,变更需配合重新加密迁移。
SECRET_ENCRYPTION_KEY =

; ===== 登录 =====
; mock 登录开关。默认关闭以确保生产安全:mock 登录信任前端传入的 open_id、无凭证校验,
; 一旦开启且该 open_id 命中 BOOTSTRAP_ADMINS,即可无凭证登录为管理员。
; 仅本地无飞书、想快速试跑时才临时改 true;生产务必保持 false 并接入飞书。
; 护栏:mock 登录会按传入 open_id 建号,故只有 DATABASE_URL 指向本地库(sqlite 或
; localhost 的 MySQL)时才允许开 —— 连着远端库开这个开关,服务会直接拒绝启动。
MOCK_AUTH = false
; 引导管理员:逗号分隔的飞书 open_id(推荐)或邮箱,命中者自动升为管理员(解决冷启动)。
; 判定时机:① 每次登录;② 服务启动时对已同步用户提权一次(故无需对方先登录)。均只升不降。
; 键的可靠性:**推荐 open_id**。邮箱现在也可用(应用已开通「获取用户邮箱信息」,平台会用
; tenant token 主动从通讯录补齐,不依赖对方先登录);但 open_id 是用户表的 upsert 主键、
; 任何写入路径都伪造不了,而邮箱是被补齐进来的普通字段 —— 用 open_id 作超管名单更稳。
; 例:BOOTSTRAP_ADMINS = ou_xxxxxxxx,ou_yyyyyyyy
BOOTSTRAP_ADMINS =
FEISHU_APP_ID =
FEISHU_APP_SECRET =
; 飞书 OAuth 回调地址;留空即自动派生为 {APP_BASE_URL}/auth/callback。
; 若手填,必须与飞书开发者后台「重定向 URL」白名单逐字一致。
FEISHU_REDIRECT_URI =

; ===== 结果落地(本地文件系统)=====
; 相对路径以 backend/ 为基准;建议放到有足够空间的数据盘
RESULT_DIR = data/results
; 下载签名链接有效期(秒)
DOWNLOAD_URL_EXPIRE_SECONDS = 3600
; 结果文件保留天数。worker 每小时清一次过期文件(启动时也先清一次)
RESULT_RETENTION_DAYS = 7

; ===== 取数资源治理 =====
; 默认查询超时(秒),适用于 MySQL 等即时查询;单个任务可在任务编辑器里单独设置覆盖。
QUERY_TIMEOUT_SECONDS = 120
; Hive 批处理默认超时(秒)。Hive 多为长耗时批处理,不套用上面的即时默认;
; 到点由客户端主动 cancel(Hive 无语句级超时)。同样可被任务上的设置覆盖。
HIVE_QUERY_TIMEOUT_SECONDS = 3600
; 单次取数最多返回行数。0 = 不限(默认,推荐):取数是「服务端游标 → CSV 直接落盘」,
; 内存占用与行数无关,不需要靠行数上限保护进程;要留意的是磁盘(RESULT_DIR)与下载体积。
; 填正数则超出即截断,审计 detail 里记 truncated —— 但**界面不会提示业务用户**,
; 他只会看到「行数比预期少」,所以填之前先想清楚由谁告诉他「这份不是全部」。
MAX_RESULT_ROWS = 0
; 「枚举值获取 SQL」一次最多返回多少个候选(超出截断,业务侧仍可手输未列出的值)
ENUM_VALUE_CAP = 1000
; 业务侧「更新枚举值」的复用窗口(秒):窗口内重复点击直接复用最新结果,不重复查库
ENUM_REFRESH_MIN_INTERVAL_SECONDS = 30

; ===== 任务订阅(定时自动运行)=====
; 订阅者连续多少个成功运行期未查看结果(下载或预览)后,自动取消其订阅并通知本人。
; 失败的运行期不计入。
SUBSCRIPTION_MISS_LIMIT = 10
; worker 扫描到期订阅计划的间隔(秒)。运行时刻精确到分钟,30 秒足够。
SCHEDULE_SCAN_INTERVAL_SECONDS = 30

; ===== 任务治理(闲置提示)=====
; 已上线任务连续多少天没有任何运行记录,就在任务列表里标成「闲置 N 天」、卡片视觉后退并
; 排到列表末尾,便于定期清掉没人用的任务。**只是提示**:闲置任务照样能跑、能订阅,
; 平台不会自动下线 —— 季度/年度才跑一次的任务一旦被自动下线,恰恰最没人记得重新上线。
; 默认 90 天(比一个季度稍长,季度任务不会被误标)。
; 运行口径与卡片上的「最后运行」同一个时间,**含编辑器试跑与订阅定时运行** ——
; 有人试跑过就说明还在维护;定时跑着的任务永远不会闲置,它确实还在产出。
; 从未运行过的任务从**创建时间**起算:「上线至今没人跑过」比「跑过但很久没跑」更该被看见。
; 只判定**已上线**的任务(草稿还没给人用,已下线的已经下线了);0 = 关掉这项提示。
; 标记只对有该任务管理权的人可见 —— 业务使用者看到自己被授权的任务变灰只会以为它坏了。
TASK_IDLE_DAYS = 90

; 注:取数身份没有配置项 —— 任务一律用**所属团队**的库账号取数(由团队管理员在团队页配置)。
; 团队账号未配置或未测通时,该任务不允许上线、已上线的也拒绝运行,不会静默回退公共账号。

; ===== 异步取数(独立 DB 轮询 worker,无需 Redis)=====
; true=请求内同步执行(无需 worker,便于本地开发);生产请设为 false 并运行 worker
RUN_INLINE = false
; worker 轮询间隔(秒)
WORKER_POLL_INTERVAL = 2.0
; worker 同时能跑几个**异步取数**(业务用户点「运行」的那些)。1 = 串行(旧行为)。
; 不含作者在编辑器里的「测试运行」—— 那些跑在 API 进程里,不受这个数约束;
; 所以目标库的连接数要按「这个数 + 同时可能试跑的人数」来备。
; 内存不随结果行数增长(取数是边取边写盘),但**磁盘会**:按「这个数 × 单份结果可能多大
; × RESULT_RETENTION_DAYS」估一下 RESULT_DIR 的容量。
WORKER_CONCURRENCY = 2

; ===== 访问地址 / 端口 =====
; 后端监听地址与端口(单端口部署下,SPA 与 /api 都由这个端口提供)
; 前面挂了 nginx 等反向代理时,务必设为 127.0.0.1,不要用 0.0.0.0 直接对外暴露端口。
BACKEND_HOST = 0.0.0.0
BACKEND_PORT = 8000
; 应用对外访问地址(单一来源)。通常只需设这一项:
;   - 本机单端口:留空即自动派生为 http://localhost:{BACKEND_PORT}
;   - 独占域名:填 https://rubick.example.com
;   - 挂在网关子路径下:填到子路径为止,如 https://htba.example.com/rubick
;     (nginx 侧用 `location /rubick/ { proxy_pass http://127.0.0.1:端口/; }` 剥掉前缀转发;
;      前端构建的资源前缀与路由 basename 由 deploy.sh 据此自动派生,无需另行配置)
APP_BASE_URL =
; CORS 允许来源;留空即跟随 APP_BASE_URL(单端口同源时不触发)。
; 仅当用 npm run dev 跑独立前端(5173)联调时,才手动设为 http://localhost:5173
FRONTEND_ORIGIN =
