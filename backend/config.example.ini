; 拉比克配置示例。部署时:cp config.example.ini config.ini 后按需修改。
; 所有配置都在 [rubick] 段;键名大小写敏感,与后端 Settings 字段一一对应。

[rubick]
; ===== 业务库(线上 MySQL,平台元数据存这里)=====
; 格式:mysql+pymysql://用户名:密码@主机:端口/库名
; 平台自身的表会带 rubick_ 前缀,可安全地与其它系统共用一个库。
DATABASE_URL = mysql+pymysql://rubick:CHANGE_ME@127.0.0.1:3306/rubick

; ===== 安全 =====
; 生产务必改成随机长字符串(如 openssl rand -hex 32)
JWT_SECRET = change-me-in-prod
JWT_EXPIRE_MINUTES = 720

; ===== 登录 =====
; mock 登录开关,默认开启;上线接入飞书后可改为 false
MOCK_AUTH = true
; 引导管理员:逗号分隔的飞书邮箱/open_id,这些人登录自动成为管理员(解决冷启动)
; 例:BOOTSTRAP_ADMINS = zhangsan@company.com,lisi@company.com
BOOTSTRAP_ADMINS =
FEISHU_APP_ID =
FEISHU_APP_SECRET =
; 飞书 OAuth 回调地址(部署后改成真实对外地址)
FEISHU_REDIRECT_URI = http://localhost:5173/auth/callback

; ===== 结果落地(本地文件系统)=====
; 相对路径以 backend/ 为基准;建议放到有足够空间的数据盘
RESULT_DIR = data/results
; 下载签名链接有效期(秒)
DOWNLOAD_URL_EXPIRE_SECONDS = 3600
; 结果文件保留天数,worker 定期清理过期文件
RESULT_RETENTION_DAYS = 7

; ===== 取数资源治理 =====
QUERY_TIMEOUT_SECONDS = 120
MAX_RESULT_ROWS = 100000

; ===== 异步取数(独立 DB 轮询 worker,无需 Redis)=====
; true=请求内同步执行(无需 worker,便于本地开发);生产请设为 false 并运行 worker
RUN_INLINE = false
; worker 轮询间隔(秒)
WORKER_POLL_INTERVAL = 2.0

; ===== 访问地址 / 端口 =====
; 后端监听地址与端口
BACKEND_HOST = 0.0.0.0
BACKEND_PORT = 8000
; 前端对外地址,用于通知里的下载/任务跳转链接
APP_BASE_URL = http://localhost:5173
; CORS 允许来源(前端对外地址)
FRONTEND_ORIGIN = http://localhost:5173
