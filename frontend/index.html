    <title>拉比克 Rubick</title>
    <!-- 标签页图标:优先矢量(高分屏不虚),不支持 SVG 图标的浏览器回落到 32px PNG。

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#4f3ff0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Libre+Franklin:wght@900&display=swap"
      rel="stylesheet"
    />
  </head>
